<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f0ff" />
<title>实时词云 · Live Word Cloud</title>
<style>
  :root{
    --bg:#f4f0ff;
    --card:rgba(255,255,255,.78);
    --line:rgba(88,64,158,.16);
    --txt:#2e2450;
    --dim:#6b5f92;
    --accent:#6d3fe0;
    --accent2:#a855f7;
    --ok:#15803d;
    --bad:#e11d48;
    --warn:#b45309;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1100px 700px at 12% -10%, #e7dcff 0%, transparent 60%),
      radial-gradient(900px 600px at 95% 0%, #dfe6ff 0%, transparent 55%),
      var(--bg);
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:22px 16px 34px;flex:1;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:44px;height:44px;border-radius:14px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 26px rgba(109,63,224,.22);
    display:grid;place-items:center;font-size:22px;
  }
  h1{font-size:19px;margin:0;letter-spacing:.5px}
  .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
  .badge{
    font-size:12px;color:var(--dim);border:1px solid var(--line);
    padding:6px 11px;border-radius:999px;background:var(--card);white-space:nowrap;
  }
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(74,222,128,.7)}
  .dot.warn{background:var(--warn)}
  .dot.bad{background:var(--bad)}
  .dot.off{background:#5b6087}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;backdrop-filter:blur(8px);
  }
  .input-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .input-label{font-size:13.5px;font-weight:600;color:var(--txt);letter-spacing:.3px}
  .input-hint{font-size:12px;color:var(--dim)}
  textarea{
    width:100%;min-height:132px;resize:vertical;
    background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;
    color:var(--txt);font-size:15px;line-height:1.65;padding:13px 14px;
    outline:none;font-family:inherit;transition:border-color .2s, box-shadow .2s;
  }
  textarea:focus{border-color:rgba(109,63,224,.6);box-shadow:0 0 0 3px rgba(109,63,224,.14)}
  textarea::placeholder{color:#9a90b8}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:11px}
  button{
    font-family:inherit;font-size:14px;cursor:pointer;border-radius:12px;
    border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--txt);
    padding:10px 16px;transition:transform .12s, background .2s, border-color .2s;
  }
  button:hover{background:#fff;border-color:rgba(109,63,224,.4)}
  button:active{transform:scale(.97)}
  button.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;font-weight:700;
    box-shadow:0 8px 22px rgba(109,63,224,.25);
  }
  button.active{
    background:rgba(109,63,224,.12);border-color:rgba(109,63,224,.45);color:var(--accent);
  }
  button.danger{
    background:rgba(225,29,72,.07);border-color:rgba(225,29,72,.38);color:var(--bad);
  }
  button.danger:hover{background:rgba(225,29,72,.14);border-color:rgba(225,29,72,.6)}
  button.danger.armed{
    background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700;
    box-shadow:0 6px 18px rgba(225,29,72,.3);
  }
  button.mini{font-size:12.5px;padding:7px 12px;border-radius:10px}
  .spacer{flex:1}

  .opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--dim)}

  /* ---- 提交板块 ---- */
  .submit-box{
    margin-top:12px;border:1px dashed rgba(109,63,224,.34);border-radius:14px;
    padding:10px 12px;background:rgba(109,63,224,.055);
    display:flex;flex-direction:column;gap:7px;
  }
  .submit-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .submit-btn{
    font-size:13.5px;padding:9px 20px;border-radius:11px;font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;
    box-shadow:0 6px 18px rgba(109,63,224,.22);
  }
  .submit-btn:hover{filter:brightness(1.06)}
  .submit-btn:active{transform:scale(.97)}
  .submit-status{font-size:12.5px;color:var(--dim)}
  .submit-status.ok{color:var(--ok)}
  .submit-status.warn{color:var(--warn)}
  .submit-hint{font-size:11.5px;color:#8378a8;line-height:1.65}

  select{
    font-family:inherit;font-size:13px;color:var(--txt);background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;cursor:pointer;
  }
  input[type=range]{width:104px;accent-color:var(--accent)}
  input[type=text]{
    font-family:inherit;font-size:13px;color:var(--txt);background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none;width:120px;
  }
  input[type=text]:focus{border-color:rgba(109,63,224,.55)}

  .stats{
    display:flex;gap:8px;flex-wrap:wrap;margin:13px 2px 10px;font-size:12.5px;color:var(--dim);
  }
  .chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.72)}
  .chip b{color:var(--txt);font-weight:600}

  /* ---- 协作面板 ---- */
  .collab{
    background:rgba(109,63,224,.055);border:1px solid rgba(109,63,224,.22);
    border-radius:16px;padding:12px 14px;margin:0 0 12px;
    display:flex;flex-direction:column;gap:10px;
  }
  .collab[hidden]{display:none}
  .collab-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
  .collab-row .room b{color:var(--accent);font-weight:600;letter-spacing:1px}
  .collab-label{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .collab-label b{color:var(--txt)}
  .peers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .peer{
    font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;
    background:#fff;color:var(--txt);
  }
  .peer.me{border-color:rgba(109,63,224,.45);color:var(--accent)}
  .peer.count{color:var(--dim);border-style:dashed}
  .tag{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
    border:1px solid rgba(168,85,247,.35);color:#7c3aed;
    border-radius:999px;padding:4px 10px;background:rgba(168,85,247,.10);
  }
  .tag[hidden]{display:none}

  /* ---- 贡献者名单 ---- */
  .roster-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .roster{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px;
  }
  .roster-empty{font-size:12.5px;color:#8b81ad;padding:6px 2px}
  .rcard{
    border:1px solid var(--line);border-radius:12px;padding:9px 11px;
    background:rgba(255,255,255,.82);font-size:12.5px;min-width:0;
  }
  .rc-top{display:flex;align-items:center;gap:7px;margin-bottom:4px;min-width:0}
  .rc-name{font-weight:600;font-size:13px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rc-name.rc-me{color:var(--accent)}
  .rc-sub{
    font-size:10.5px;border:1px solid rgba(21,128,61,.38);color:var(--ok);
    border-radius:999px;padding:1px 7px;background:rgba(21,128,61,.10);
  }
  .rc-meta{color:var(--dim);font-size:11.5px}
  .rc-words{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
  .wchip{
    font-size:11px;border:1px solid rgba(109,63,224,.25);color:#6d28d9;
    border-radius:999px;padding:2px 8px;background:rgba(109,63,224,.08);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .cloud-box{
    position:relative;flex:1;min-height:340px;border-radius:18px;
    border:1px solid var(--line);overflow:hidden;
    background:radial-gradient(700px 420px at 50% 40%, #fdfbff 0%, #f7f2ff 55%, #f0e8ff 100%);
  }
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
  .empty{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:var(--dim);font-size:14px;pointer-events:none;padding:20px;
  }
  .empty.hide{display:none}
  .tip{
    position:absolute;pointer-events:none;transform:translate(-50%,-140%);
    background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--txt);
    padding:6px 10px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .12s;
    box-shadow:0 8px 20px rgba(76,48,140,.18);
  }
  .tip.show{opacity:1}
  .hint{
    position:absolute;right:12px;bottom:10px;font-size:11.5px;color:#8b81ad;
    background:rgba(255,255,255,.8);padding:4px 9px;border-radius:8px;
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:rgba(46,36,80,.95);border:1px solid rgba(46,36,80,.35);color:#fff;
    padding:10px 18px;border-radius:12px;font-size:13.5px;opacity:0;
    pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;
    box-shadow:0 10px 30px rgba(76,48,140,.28);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{margin-top:14px;text-align:center;font-size:12px;color:#8b81ad}
  .ver{opacity:.6;font-size:11px;margin-left:4px}

  /* ---- 高频词汇榜 ---- */
  .table-panel{margin-top:12px}
  .table-panel .bar{margin-top:0}
  .table-title{font-size:14px;letter-spacing:.3px}
  .table-title span{font-weight:400;color:var(--dim);font-size:12px;margin-left:6px}
  .table-wrap{
    max-height:268px;overflow:auto;margin-top:10px;
    border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.62);
  }
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:440px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid rgba(88,64,158,.10);white-space:nowrap}
  th{
    position:sticky;top:0;z-index:1;font-weight:500;font-size:12px;color:#5a4d86;
    background:#eee8fd;
  }
  td.n{color:var(--dim);width:46px}
  td.w{color:var(--txt);font-weight:600}
  td.who{color:var(--dim);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  tr:last-child td{border-bottom:none}

  @media (max-width:640px){
    .wrap{padding:16px 12px 24px}
    h1{font-size:17px}
    .logo{width:40px;height:40px;border-radius:12px;font-size:20px}
    .panel{padding:11px;border-radius:16px}
    textarea{min-height:116px;font-size:16px} /* 16px 防 iOS 聚焦缩放 */
    button{padding:11px 15px;font-size:14.5px}
    button.mini{padding:8px 12px;font-size:12.5px}
    .bar{gap:8px}
    .spacer{display:none}
    .opts{width:100%;font-size:12.5px}
    .cloud-box{min-height:56vh;border-radius:16px}
    .hint{display:none}
    .collab{padding:11px;border-radius:14px}
    .roster{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .table-wrap{max-height:230px}
    .table-panel .bar{gap:6px}
    th,td{padding:7px 10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">☁️</div>
      <div>
        <h1>实时词云</h1>
        <div class="sub">输入文字 → 即时生成词云 · 多人各自输入 · 汇总词云</div>
      </div>
    </div>
    <div class="badge"><span class="dot"></span>本地处理 · 不上传内容</div>
  </header>

  <section class="panel">
    <div class="input-head">
      <span class="input-label" id="inputLabel">我的文本</span>
      <span class="input-hint" id="inputHint">输入即实时生成词云</span>
    </div>
    <textarea id="input" placeholder="在这里粘贴或输入文字，词云会实时生成…"></textarea>
    <div class="bar">
      <button class="primary" id="btnGen">生成词云</button>
      <button id="btnClear">清空</button>
      <button id="btnCollab">开启协作</button>
      <div class="spacer"></div>
      <div class="opts">
        <span>配色</span>
        <select id="palette">
          <option value="neon">霓虹</option>
          <option value="warm">暖阳</option>
          <option value="cool">深海</option>
          <option value="mono">极简</option>
          <option value="random">随机</option>
        </select>
        <span>词数</span>
        <input type="range" id="limit" min="20" max="150" step="5" value="80" />
        <span id="limitVal">80</span>
      </div>
    </div>

    <div class="submit-box">
      <div class="submit-row">
        <button class="submit-btn" id="btnSubmit">提交</button>
        <span class="submit-status" id="submitStatus">未提交</span>
      </div>
      <div class="submit-hint" id="submitHint"></div>
    </div>
  </section>

  <section class="collab" id="collabPanel" hidden>
    <div class="collab-row">
      <span class="collab-label" id="collabStatus"><i class="dot warn"></i>连接中…</span>
      <span class="room">房间 <b id="roomId">—</b></span>
      <button class="mini" id="btnCopyLink">复制邀请链接</button>
      <button class="mini" id="btnLeave">退出房间</button>
      <button class="mini danger" id="btnDissolve">解散房间</button>
    </div>
    <div class="collab-row">
      <label class="collab-label">我的昵称
        <input type="text" id="myName" maxlength="12" />
      </label>
      <div class="peers" id="peerList"></div>
      <span class="tag" id="sharedTag" hidden>🔗 各自输入 · 实时汇总</span>
    </div>
    <div class="roster-head">
      <span class="collab-label">贡献者 <b id="rosterCount">0</b> 人</span>
      <span class="collab-label" style="opacity:.75">每人独享输入框，词频汇入下方词云</span>
    </div>
    <div class="roster" id="roster"></div>
    <div class="submit-hint">最后一人退出房间时，服务器上这个房间的副本会被自动清理（释放内存）；也可以随时点「解散房间」立即清理。</div>
  </section>

  <div class="stats">
    <span class="chip">字符 <b id="sChars">0</b></span>
    <span class="chip">识别词 <b id="sWords">0</b></span>
    <span class="chip">展示词 <b id="sShow">0</b></span>
    <span class="chip" id="sTime">—</span>
  </div>

  <div class="cloud-box" id="cloudBox">
    <canvas id="cloud"></canvas>
    <div class="empty" id="empty">输入文字后，词云会自动出现在这里 ✨</div>
    <div class="tip" id="tip"></div>
    <div class="hint">点击词语可复制</div>
  </div>

  <section class="panel table-panel">
    <div class="bar">
      <b class="table-title">高频词汇榜<span id="tableCount"></span></b>
      <div class="spacer"></div>
      <button class="mini" id="btnCopyTable">复制词表</button>
      <button class="mini" id="btnExportCsv">导出 CSV</button>
      <button class="mini" id="btnExportXls">导出 Excel</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>词语</th><th>次数</th><th>提及人数</th><th>提及者</th></tr>
        </thead>
        <tbody id="wordTableBody"></tbody>
      </table>
    </div>
  </section>

  <footer>所有分词与渲染均在你的浏览器本地完成，内容不会上传服务器 <span id="buildVer" class="ver"></span></footer>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js?v=20261112c"></script>
</body>
</html>

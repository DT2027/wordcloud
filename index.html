<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1020" />
<title>实时词云 · Live Word Cloud</title>
<style>
  :root{
    --bg:#0b0d1a;
    --card:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.12);
    --txt:#eef1ff;
    --dim:#a3a8c8;
    --accent:#6ee7ff;
    --accent2:#a78bfa;
    --ok:#4ade80;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1100px 700px at 12% -10%, #2b2170 0%, transparent 60%),
      radial-gradient(900px 600px at 95% 0%, #0d4a63 0%, transparent 55%),
      var(--bg);
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:22px 16px 34px;flex:1;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:44px;height:44px;border-radius:14px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 26px rgba(110,231,255,.28);
    display:grid;place-items:center;font-size:22px;
  }
  h1{font-size:19px;margin:0;letter-spacing:.5px}
  .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
  .badge{
    font-size:12px;color:var(--dim);border:1px solid var(--line);
    padding:6px 11px;border-radius:999px;background:var(--card);white-space:nowrap;
  }
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;backdrop-filter:blur(8px);
  }
  textarea{
    width:100%;min-height:132px;resize:vertical;
    background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;
    color:var(--txt);font-size:15px;line-height:1.65;padding:13px 14px;
    outline:none;font-family:inherit;transition:border-color .2s, box-shadow .2s;
  }
  textarea:focus{border-color:rgba(110,231,255,.65);box-shadow:0 0 0 3px rgba(110,231,255,.14)}
  textarea::placeholder{color:#6f749b}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:11px}
  button{
    font-family:inherit;font-size:14px;cursor:pointer;border-radius:12px;
    border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);
    padding:10px 16px;transition:transform .12s, background .2s, border-color .2s;
  }
  button:hover{background:rgba(255,255,255,.12)}
  button:active{transform:scale(.97)}
  button.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#0a0c1c;font-weight:700;
    box-shadow:0 8px 22px rgba(110,231,255,.25);
  }
  .spacer{flex:1}

  .opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
  select{
    font-family:inherit;font-size:13px;color:var(--txt);background:rgba(0,0,0,.3);
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;cursor:pointer;
  }
  input[type=range]{width:104px;accent-color:var(--accent)}

  .stats{
    display:flex;gap:8px;flex-wrap:wrap;margin:13px 2px 10px;font-size:12.5px;color:var(--dim);
  }
  .chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.04)}
  .chip b{color:var(--txt);font-weight:600}

  .cloud-box{
    position:relative;flex:1;min-height:340px;border-radius:18px;
    border:1px solid var(--line);overflow:hidden;
    background:radial-gradient(700px 420px at 50% 42%, rgba(110,231,255,.10), rgba(255,255,255,.02) 60%, transparent 100%);
  }
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
  .empty{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:var(--dim);font-size:14px;pointer-events:none;padding:20px;
  }
  .empty.hide{display:none}
  .tip{
    position:absolute;pointer-events:none;transform:translate(-50%,-140%);
    background:rgba(10,12,28,.94);border:1px solid var(--line);border-radius:10px;
    padding:6px 10px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .12s;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
  }
  .tip.show{opacity:1}
  .hint{
    position:absolute;right:12px;bottom:10px;font-size:11.5px;color:#6f749b;
    background:rgba(0,0,0,.28);padding:4px 9px;border-radius:8px;
  }
  footer{margin-top:14px;text-align:center;font-size:12px;color:#6f749b}

  @media (max-width:640px){
    .wrap{padding:16px 12px 24px}
    h1{font-size:17px}
    .logo{width:40px;height:40px;border-radius:12px;font-size:20px}
    .panel{padding:11px;border-radius:16px}
    textarea{min-height:116px;font-size:16px} /* 16px 防 iOS 聚焦缩放 */
    button{padding:11px 15px;font-size:14.5px}
    .bar{gap:8px}
    .spacer{display:none}
    .opts{width:100%;font-size:12.5px}
    .cloud-box{min-height:56vh;border-radius:16px}
    .hint{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">☁️</div>
      <div>
        <h1>实时词云</h1>
        <div class="sub">输入文字 → 即时生成词云 · 手机与电脑同一链接</div>
      </div>
    </div>
    <div class="badge"><span class="dot"></span>本地处理 · 不上传内容</div>
  </header>

  <section class="panel">
    <textarea id="input" placeholder="在这里粘贴或输入文字，词云会实时生成…"></textarea>
    <div class="bar">
      <button class="primary" id="btnGen">生成词云</button>
      <button id="btnSample">示例文本</button>
      <button id="btnClear">清空</button>
      <div class="spacer"></div>
      <div class="opts">
        <span>配色</span>
        <select id="palette">
          <option value="neon">霓虹</option>
          <option value="warm">暖阳</option>
          <option value="cool">深海</option>
          <option value="mono">极简</option>
          <option value="random">随机</option>
        </select>
        <span>词数</span>
        <input type="range" id="limit" min="20" max="150" step="5" value="80" />
        <span id="limitVal">80</span>
      </div>
    </div>
  </section>

  <div class="stats">
    <span class="chip">字符 <b id="sChars">0</b></span>
    <span class="chip">识别词 <b id="sWords">0</b></span>
    <span class="chip">展示词 <b id="sShow">0</b></span>
    <span class="chip" id="sTime">—</span>
  </div>

  <div class="cloud-box" id="cloudBox">
    <canvas id="cloud"></canvas>
    <div class="empty" id="empty">输入文字后，词云会自动出现在这里 ✨</div>
    <div class="tip" id="tip"></div>
    <div class="hint">点击词语可复制</div>
  </div>

  <footer>所有分词与渲染均在你的浏览器本地完成，内容不会上传服务器</footer>
</div>

<script src="dict.js"></script>
<script>
(function () {
  'use strict';

  var DICT = new Set((window.WORDLIST || '').split(/\s+/).filter(Boolean));

  /* ---------------- DOM ---------------- */
  var input   = document.getElementById('input');
  var canvas  = document.getElementById('cloud');
  var box     = document.getElementById('cloudBox');
  var empty   = document.getElementById('empty');
  var tip     = document.getElementById('tip');
  var selPal  = document.getElementById('palette');
  var rng     = document.getElementById('limit');
  var rngVal  = document.getElementById('limitVal');
  var btnGen  = document.getElementById('btnGen');
  var btnSmp  = document.getElementById('btnSample');
  var btnClr  = document.getElementById('btnClear');
  var sChars  = document.getElementById('sChars');
  var sWords  = document.getElementById('sWords');
  var sShow   = document.getElementById('sShow');
  var sTime   = document.getElementById('sTime');

  var ctx = canvas.getContext('2d');
  var FONT = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';
  var items = [], hitList = [], timer = null;

  var SAMPLE = '人工智能正在改变世界。自然语言处理让机器能够理解人类的语言，' +
    '大模型通过海量文本训练获得语言能力。神经网络是深度学习的核心，卷积神经网络擅长图像识别，' +
    '循环神经网络适合处理序列数据。机器学习包括监督学习、无监督学习和强化学习三种主要方法。' +
    '数据是模型训练的基础，数据质量决定了模型效果。词云是一种可视化方式，把文本中的高频词以不同字号展示，' +
    '帮助我们快速把握文本主题。可视化让复杂的信息变得直观，设计与可视化结合能提升沟通效率。' +
    'Web 技术让词云可以在浏览器里实时运行，无需服务器处理，JavaScript 与 Canvas 是关键。';

  /* ---------------- 停用词 ---------------- */
  var STOP_CN = ('的 了 是 在 和 与 及 或 有 不 就 也 都 而 之 其 被 把 让 给 从 向 由 对 为 以 于 并 但 却 还 又 再 很 更 最 ' +
    '我 你 他 她 它 们 这 那 些 个 一个 上 下 中 出 里 来 去 到 说 要 会 能 得 地 着 过 看 好 自 已 可以 因为 所以 但是 ' +
    '如果 虽然 什么 怎么 这样 那样 一些 一下 这个 那个 已经 没有 就是 还是 时候 现在 知道 觉得 因此 然后 其实 只是 或者 ' +
    '而且 并且 以及 通过 进行 出现 存在 需要 应该 可能 方面 问题 工作 公司 企业 数据 市场 用户 产品 服务 我们 你们 他们 ' +
    '一种 让 使 以 及 等 等等 该 本 各 每 所有 其中 其他 情况 内容 方式 时间 部分 相关 不同 主要 重要').split(/\s+/);
  var STOP_SET = new Set(STOP_CN);
  var EDGE_BAD = new Set('的了着过地得和与或及等就都也而之其于把被让给从向由对为以因但却还又再很更最是有在会能要说来去做好自'.split(''));
  var STOP_EN = new Set(('the a an and or of to in for on with is are was were be been this that these those it its as at by from ' +
    'not but if then else when while we you they he she i me my our your their them us have has had do does did can could will ' +
    'would shall should may might must about into over under more most other some such no nor only own same so too very just').split(/\s+/));
  var NUM_ONLY = /^[零一二三四五六七八九十百千万亿两]+$/;   // 纯数字词（“三十”“百万”）视为噪声

  /* ---------------- 中文分词：内聚度(PMI) + 上下文自由度 + 重叠消解 ---------------- */
  function extractWords(text) {
    var low = text.toLowerCase();
    var runs = low.match(/[\u4e00-\u9fff\u3400-\u4dbf]+|[a-z][a-z0-9'’\-]*/g) || [];
    var MAXLEN = 6;
    var table = new Map();          // 词 -> {c,len,left,right,pos}
    var chars = new Map();          // 单字频次
    var en = new Map();
    var total = 0, offset = 0;

    runs.forEach(function (run) {
      if (/^[a-z]/.test(run)) {
        if (run.length >= 2 && !STOP_EN.has(run)) en.set(run, (en.get(run) || 0) + 1);
        return;
      }
      total += run.length;
      for (var i = 0; i < run.length; i++) {
        chars.set(run.charAt(i), (chars.get(run.charAt(i)) || 0) + 1);
        for (var len = 2; len <= MAXLEN && i + len <= run.length; len++) {
          var s = run.substr(i, len);
          var e = table.get(s);
          if (!e) { e = { w: s, c: 0, len: len, left: new Set(), right: new Set(), pos: [] }; table.set(s, e); }
          e.c++;
          if (i > 0) e.left.add(run.charAt(i - 1));
          if (i + len < run.length) e.right.add(run.charAt(i + len));
          if (e.pos.length < 80) e.pos.push(offset + i);
        }
      }
      offset += run.length;
    });
    if (!total && !en.size) return [];

    // 评分：内聚度 + 上下文自由度 + 长度
    var cands = [];
    table.forEach(function (e) {
      if (STOP_SET.has(e.w)) return;
      if (NUM_ONLY.test(e.w)) return;
      if (EDGE_BAD.has(e.w.charAt(0)) || EDGE_BAD.has(e.w.charAt(e.w.length - 1))) return;
      var minPmi = Infinity;
      for (var i = 1; i < e.len; i++) {
        var l = e.w.slice(0, i), r = e.w.slice(i);
        var cl = l.length === 1 ? (chars.get(l) || 0) : ((table.get(l) || {}).c || 0);
        var cr = r.length === 1 ? (chars.get(r) || 0) : ((table.get(r) || {}).c || 0);
        if (!cl || !cr) { minPmi = -Infinity; break; }
        var pmi = Math.log((e.c * total) / (cl * cr));
        if (pmi < minPmi) minPmi = pmi;
      }
      if (minPmi === -Infinity) return;
      var freedom = e.left.size * e.right.size;
      var thr = total < 400 ? 1.9 : 2.1;
      var isDict = DICT.has(e.w);
      // 收录规则：统计显著 / 词典白名单（低频专业词） / 上下文自由度足够高
      var ok = (e.c >= 2 && minPmi >= thr)
            || (isDict && e.c >= 1 && minPmi >= 0.8)
            || (e.c === 1 && e.len >= 3 && freedom >= 4 && minPmi >= 2.5);
      if (!ok) return;
      e.pmi = minPmi;
      e.isDict = isDict;
      e.score = e.c * (1 + Math.min(minPmi, 6) / 2) * (1 + 0.5 * Math.log(1 + freedom)) * (1 + 0.12 * (e.len - 2));
      cands.push(e);
    });

    // 冲突消解：位置重叠且频次接近的两个候选只能留一个（保留得分更高者）
    function conflict(a, b) {
      var ratio = Math.min(a.c, b.c) / Math.max(a.c, b.c);
      if (ratio < 0.6) return false;
      var minLen = Math.min(a.len, b.len);
      for (var i = 0; i < a.pos.length; i++) {
        var pa = a.pos[i];
        for (var j = 0; j < b.pos.length; j++) {
          var pb = b.pos[j];
          var ov = Math.min(pa + a.len, pb + b.len) - Math.max(pa, pb);
          if (ov >= minLen * 0.5) return true;
        }
      }
      return false;
    }
    cands.sort(function (a, b) { return b.score - a.score; });
    var kept = [];
    cands.forEach(function (cd) {
      for (var i = 0; i < kept.length; i++) if (conflict(cd, kept[i])) return;
      kept.push(cd);
    });

    var out = kept.map(function (k) { return { w: k.w, c: k.c }; });

    // 极短文本：退化为二元组，保证有反馈
    if (!out.length && total > 0 && total < 80) {
      var big = new Map();
      runs.forEach(function (run) {
        if (/^[a-z]/.test(run)) return;
        for (var i = 0; i + 2 <= run.length; i++) {
          var g = run.substr(i, 2);
          if (STOP_SET.has(g)) continue;
          if (EDGE_BAD.has(g.charAt(0)) || EDGE_BAD.has(g.charAt(1))) continue;
          big.set(g, (big.get(g) || 0) + 1);
        }
      });
      big.forEach(function (c, w) { out.push({ w: w, c: c }); });
    }

    en.forEach(function (c, w) { out.push({ w: w, c: c }); });
    return out;
  }

  /* ---------------- 配色 ---------------- */
  var PALETTES = {
    neon:  ['#6ee7ff','#a78bfa','#f472b6','#4ade80','#facc15','#fb923c','#38bdf8','#e879f9'],
    warm:  ['#fb923c','#f43f5e','#f59e0b','#ef4444','#eab308','#fbbf24','#f97316','#dc2626'],
    cool:  ['#38bdf8','#22d3ee','#818cf8','#2dd4bf','#60a5fa','#a78bfa','#0ea5e9','#14b8a6'],
    mono:  ['#e6e8f0','#b9bed6','#9499b8','#d5d8e6','#8a90ad','#c7cadb','#a6abc6','#dde0ee'],
    random:['#ff6b6b','#ffd93d','#6bcB77','#4d96ff','#c77dff','#ff9f43','#00d2d3','#f368e0']
  };
  function pickColor(i) {
    var p = PALETTES[selPal.value] || PALETTES.neon;
    if (selPal.value === 'random') return p[Math.floor(Math.random() * p.length)];
    return p[i % p.length];
  }

  /* ---------------- 词云布局：网格占用 + 螺旋排布 ---------------- */
  function render() {
    var rect = box.getBoundingClientRect();
    var W = Math.max(240, Math.floor(rect.width));
    var H = Math.max(240, Math.floor(rect.height));
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';

    hitList = [];
    if (!items.length) { empty.classList.remove('hide'); sShow.textContent = '0'; return; }
    empty.classList.add('hide');

    var limit = parseInt(rng.value, 10) || 80;
    var list = items.slice(0, limit);
    var maxC = list[0].c || 1;
    var maxFont = Math.max(28, Math.min(72, W * 0.105));
    var minFont = Math.max(11, Math.min(19, W * 0.021));

    var g = 6, pad = g * 0.5;                       // 网格粒度 / 词间距
    var cols = Math.ceil(W / g) + 2, rows = Math.ceil(H / g) + 2;
    var grid = new Uint8Array(cols * rows);
    var gx0 = Math.floor(cols / 2), gy0 = Math.floor(rows / 2);

    function region(x, y, w, h) {
      var c0 = Math.floor((x - pad) / g), c1 = Math.floor((x + w + pad) / g);
      var r0 = Math.floor((y - pad) / g), r1 = Math.floor((y + h + pad) / g);
      if (c0 < 0) c0 = 0; if (r0 < 0) r0 = 0;
      if (c1 > cols - 1) c1 = cols - 1; if (r1 > rows - 1) r1 = rows - 1;
      return [c0, c1, r0, r1];
    }
    function isFree(x, y, w, h) {
      if (x < 1 || y < 1 || x + w > W - 1 || y + h > H - 1) return false;
      var gx = Math.floor(x / g), gy = Math.floor(y / g);
      if (grid[gy * cols + gx]) return false;      // 锚点快速失败
      var rg = region(x, y, w, h);
      for (var r = rg[2]; r <= rg[3]; r++) {
        var base = r * cols;
        for (var c = rg[0]; c <= rg[1]; c++) if (grid[base + c]) return false;
      }
      return true;
    }
    function occupy(x, y, w, h) {
      var rg = region(x, y, w, h);
      for (var r = rg[2]; r <= rg[3]; r++) {
        var base = r * cols;
        for (var c = rg[0]; c <= rg[1]; c++) grid[base + c] = 1;
      }
    }

    // 预生成一条由内向外、贴合画布比例的椭圆螺旋路径（网格对齐），所有词共用
    var path = [];
    (function buildPath() {
      var pathSteps = 12000, turns = 45;
      var angMax = Math.PI * 2 * turns, dAng = angMax / pathSteps;
      var rx = W * 0.58, ry = H * 0.58;
      for (var t = 0; t <= pathSteps; t++) {
        var ang = t * dAng;
        var rr = ang / angMax;
        var px = W / 2 + rr * rx * Math.cos(ang);
        var py = H / 2 + rr * ry * Math.sin(ang);
        var gx = Math.floor(px / g), gy = Math.floor(py / g);
        if (gx < 0) gx = 0; if (gy < 0) gy = 0;
        if (gx > cols - 1) gx = cols - 1; if (gy > rows - 1) gy = rows - 1;
        path.push(gx * g, gy * g);
      }
    })();

    function findSpot(w, h) {
      for (var i = 0; i < path.length; i += 2) {
        if (isFree(path[i], path[i + 1], w, h)) {
          return { x: path[i], y: path[i + 1], w: w, h: h };
        }
      }
      return null;
    }

    list.forEach(function (it, idx) {
      var ratio = Math.log(1 + it.c) / Math.log(1 + maxC);
      var fs = minFont + (maxFont - minFont) * Math.pow(ratio, 0.62);
      var spot = null;
      for (var k = 0; k < 6 && !spot; k++) {
        ctx.font = '700 ' + fs.toFixed(1) + 'px ' + FONT;
        var tw = ctx.measureText(it.w).width;
        var th = fs * 1.06;
        spot = findSpot(tw, th);
        if (!spot) fs *= 0.86;
      }
      if (!spot) return;
      occupy(spot.x, spot.y, spot.w, spot.h);
      ctx.fillStyle = pickColor(idx);
      ctx.fillText(it.w, spot.x, spot.y);
      hitList.push({ x: spot.x, y: spot.y, w: spot.w, h: spot.h, w2: it.w, c: it.c });
    });

    sShow.textContent = String(hitList.length);
  }

  /* ---------------- 更新流程 ---------------- */
  function update() {
    var text = input.value || '';
    sChars.textContent = String(text.length);
    if (!text.trim()) {
      items = []; sWords.textContent = '0'; sTime.textContent = '—';
      render(); return;
    }
    var now = function () { return (window.performance && performance.now) ? performance.now() : Date.now(); };
    var t0 = now();
    items = extractWords(text);
    items.sort(function (a, b) { return b.c - a.c; });
    var t1 = now();
    sWords.textContent = String(items.length);
    render();
    var t2 = now();
    sTime.textContent = '分词 ' + (t1 - t0).toFixed(0) + ' ms · 渲染 ' + (t2 - t1).toFixed(0) + ' ms';
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(update, 250);
  }

  /* ---------------- 交互 ---------------- */
  input.addEventListener('input', schedule);
  btnGen.addEventListener('click', function () { clearTimeout(timer); update(); });
  btnSmp.addEventListener('click', function () {
    input.value = SAMPLE; clearTimeout(timer); update(); input.blur();
  });
  btnClr.addEventListener('click', function () {
    input.value = ''; clearTimeout(timer); update(); input.focus();
  });
  selPal.addEventListener('change', render);
  rng.addEventListener('input', function () { rngVal.textContent = rng.value; render(); });

  canvas.addEventListener('mousemove', function (e) {
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var found = null;
    for (var i = 0; i < hitList.length; i++) {
      var h = hitList[i];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { found = h; break; }
    }
    if (found) {
      tip.textContent = found.w2 + ' · ' + found.c + ' 次';
      tip.style.left = (found.x + found.w / 2) + 'px';
      tip.style.top = found.y + 'px';
      tip.classList.add('show');
      canvas.style.cursor = 'pointer';
    } else {
      tip.classList.remove('show');
      canvas.style.cursor = 'default';
    }
  });
  canvas.addEventListener('mouseleave', function () { tip.classList.remove('show'); });
  canvas.addEventListener('click', function () {
    if (!tip.classList.contains('show')) return;
    var txt = tip.textContent.split(' · ')[0];
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        var old = tip.textContent;
        tip.textContent = '已复制：' + txt;
        setTimeout(function () { tip.textContent = old; }, 1200);
      }).catch(function () {});
    }
  });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(render, 140);
  });

  /* ---------------- 启动 ---------------- */
  input.value = SAMPLE;
  update();
})();
</script>
</body>
</html>
